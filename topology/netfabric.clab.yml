name: netfabric

topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:latest
      binds:
        - ../routing/frr/r1:/etc/frr
      exec:
        - ip addr add 10.0.12.1/30 dev eth1
        - ip addr add 10.0.13.1/30 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up

    r2:
      kind: linux
      image: quay.io/frrouting/frr:latest
      binds:
        - ../routing/frr/r2:/etc/frr
      exec:
        - ip addr add 10.0.12.2/30 dev eth1
        - ip addr add 10.0.24.1/30 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up

    r3:
      kind: linux
      image: quay.io/frrouting/frr:latest
      binds:
        - ../routing/frr/r3:/etc/frr
      exec:
        - ip addr add 10.0.13.2/30 dev eth1
        - ip addr add 10.0.34.1/30 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up

    r4:
      kind: linux
      image: quay.io/frrouting/frr:latest
      binds:
        - ../routing/frr/r4:/etc/frr
      exec:
        - ip addr add 10.0.24.2/30 dev eth1
        - ip addr add 10.0.34.2/30 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]
    - endpoints: ["r3:eth2", "r4:eth2"]
