name: netfabric

topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:latest
      binds:
        - ../routing/frr/r1:/etc/frr
      exec:
        - ip addr add 10.0.12.1/30 dev eth1
        - ip addr add 10.0.13.1/30 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up

    r2:
      kind: linux
      image: quay.io/frrouting/frr:latest
      binds:
        - ../routing/frr/r2:/etc/frr
      exec:
        - ip addr add 10.0.12.2/30 dev eth1
        - ip addr add 10.0.24.1/30 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up

    r3:
      kind: linux
      image: quay.io/frrouting/frr:latest
      binds:
        - ../routing/frr/r3:/etc/frr
      exec:
        - ip addr add 10.0.13.2/30 dev eth1
        - ip addr add 10.0.34.1/30 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up

    r4:
      kind: linux
      image: quay.io/frrouting/frr:latest
      binds:
        - ../routing/frr/r4:/etc/frr
      exec:
        - ip addr add 10.0.24.2/30 dev eth1
        - ip addr add 10.0.34.2/30 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up

    client:
      kind: linux
      image: networkstatic/iperf3:latest
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.0.0.0/8 via 10.10.10.1

    server:
      kind: linux
      image: networkstatic/iperf3:latest
      exec:
        - ip addr add 10.20.20.20/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.0.0.0/8 via 10.20.20.1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]
    - endpoints: ["r3:eth2", "r4:eth2"]
    - endpoints: ["r1:eth3", "client:eth1"]
    - endpoints: ["r4:eth3", "server:eth1"]
